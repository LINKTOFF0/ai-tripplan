<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 旅行规划助手 — AiTripPlan</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- markdown-it CDN -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <!-- Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

    <!-- ===== Top Navigation Bar ===== -->
    <header class="topbar">
        <div class="topbar-brand">
            <span class="brand-icon">✈️</span>
            <h1>AI 旅行规划助手</h1>
        </div>
        <div class="topbar-status">
            <span id="statusIndicator" class="status-dot status-checking"></span>
            <span id="statusText">检测中...</span>
        </div>
    </header>

    <!-- ===== Main Layout Container ===== -->
    <div class="app-container">

        <!-- ===== Left Sidebar: Travel Parameters ===== -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-inner">
                <h2 class="sidebar-title">
                    <i class="ri-equalizer-line"></i> 旅行参数
                </h2>

                <!-- Departure -->
                <div class="form-group">
                    <label for="departure"><i class="ri-navigation-line"></i> 出发地</label>
                    <input type="text" id="departure" placeholder="例如：上海、深圳...">
                </div>

                <!-- Destination -->
                <div class="form-group">
                    <label for="destination"><i class="ri-map-pin-line"></i> 目的地</label>
                    <input type="text" id="destination" placeholder="例如：北京、云南、日本...">
                </div>

                <!-- Travel Mode -->
                <div class="form-group">
                    <label for="travelMode"><i class="ri-car-line"></i> 出行方式</label>
                    <select id="travelMode">
                        <option value="">不限</option>
                        <option value="自驾">🚗 自驾</option>
                        <option value="铁路">🚄 铁路</option>
                        <option value="飞机">✈️ 飞机</option>
                    </select>
                </div>

                <!-- Departure Date -->
                <div class="form-group">
                    <label for="departureDate"><i class="ri-calendar-event-line"></i> 出发日期</label>
                    <input type="date" id="departureDate">
                </div>

                <!-- Days -->
                <div class="form-group">
                    <label for="days"><i class="ri-calendar-line"></i> 出行天数</label>
                    <select id="days">
                        <option value="">不限</option>
                        <option value="1">1 天</option>
                        <option value="2">2 天</option>
                        <option value="3" selected>3 天</option>
                        <option value="4">4 天</option>
                        <option value="5">5 天</option>
                        <option value="7">7 天</option>
                        <option value="10">10 天</option>
                    </select>
                </div>

                <!-- Budget -->
                <div class="form-group">
                    <label for="budget"><i class="ri-money-cny-circle-line"></i> 预算范围</label>
                    <select id="budget">
                        <option value="">不限</option>
                        <option value="经济实惠">经济实惠</option>
                        <option value="中等预算" selected>中等预算</option>
                        <option value="舒适享受">舒适享受</option>
                        <option value="奢华体验">奢华体验</option>
                    </select>
                </div>

                <!-- Travel Style Preferences -->
                <div class="form-group">
                    <label><i class="ri-heart-line"></i> 旅行偏好</label>
                    <div class="tag-group" id="preferenceTags">
                        <span class="tag" data-value="美食">🍜 美食</span>
                        <span class="tag" data-value="自然风光">🏔️ 自然风光</span>
                        <span class="tag" data-value="人文历史">🏛️ 人文历史</span>
                        <span class="tag" data-value="购物">🛍️ 购物</span>
                        <span class="tag" data-value="亲子">👨‍👩‍👧 亲子</span>
                        <span class="tag" data-value="摄影">📷 摄影</span>
                        <span class="tag" data-value="探险">🧗 探险</span>
                        <span class="tag" data-value="休闲度假">🌴 休闲度假</span>
                    </div>
                </div>

                <!-- Quick Templates -->
                <div class="form-group">
                    <label><i class="ri-flashlight-line"></i> 快速模板</label>
                    <div class="template-list" id="templateList">
                        <button class="template-btn" data-prompt="帮我规划一个北京3日游，喜欢历史文化，中等预算">
                            🏛️ 北京3日文化游
                        </button>
                        <button class="template-btn" data-prompt="帮我规划一个成都美食之旅，2天时间，经济实惠">
                            🍜 成都2日美食
                        </button>
                        <button class="template-btn" data-prompt="帮我规划一个云南亲子游，5天时间，舒适享受">
                            👨‍👩‍👧 云南5日亲子
                        </button>
                        <button class="template-btn" data-prompt="帮我规划一个杭州周末2日游，喜欢自然风光和摄影">
                            📷 杭州周末摄影
                        </button>
                        <button class="template-btn" data-prompt="帮我规划一个三亚休闲度假，4天时间，中等预算">
                            🌴 三亚4日度假
                        </button>
                    </div>
                </div>

                <!-- Build Prompt Button -->
                <button id="buildPromptBtn" class="btn-build">
                    <i class="ri-magic-line"></i> 生成提示词
                </button>
            </div>
        </aside>

        <!-- ===== Center: Chat Area ===== -->
        <main class="chat-area">
            <!-- Welcome Screen -->
            <div id="welcomeScreen" class="welcome-screen">
                <div class="welcome-icon">🌍</div>
                <h2>你好！我是你的 AI 旅行规划助手</h2>
                <p>告诉我你的旅行需求，我将为你量身定制完美的旅行计划</p>
                <div class="suggestion-chips">
                    <span class="suggestion-chip" data-prompt="帮我规划一个上海3日游，喜欢美食和购物，中等预算">"上海3日游，美食购物"</span>
                    <span class="suggestion-chip" data-prompt="帮我规划一个西安4日游，对历史文化特别感兴趣">"西安4日深度文化游"</span>
                    <span class="suggestion-chip" data-prompt="帮我规划一个川西自驾7日游，喜欢自然风光和摄影">"川西7日自驾摄影"</span>
                </div>
            </div>

            <!-- Messages Container -->
            <div id="messagesContainer" class="messages-container">
                <!-- Messages will be dynamically added here -->

                <!-- Thinking Indicator (inside container so it scrolls with messages) -->
                <div id="thinkingIndicator" class="thinking-indicator hidden">
                    <div class="thinking-bubble">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="thinking-text">AI 正在为你规划行程</span>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea
                        id="promptInput"
                        class="prompt-input"
                        placeholder="描述你的旅行需求，例如：帮我规划一个北京3日游，喜欢历史文化和美食..."
                        rows="1"
                        maxlength="2000"
                    ></textarea>
                    <button id="sendBtn" class="send-btn" title="发送">
                        <i id="sendBtnIcon" class="ri-send-plane-fill"></i>
                    </button>
                </div>
                <div class="input-hint">
                    <span>按 Enter 发送，Shift + Enter 换行</span>
                    <span id="charCount">0 / 2000</span>
                </div>
            </div>
        </main>

    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
